name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and release APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      - name: Write android/key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Read version from pubspec
        id: version
        run: |
          VERSION_LINE="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1)"
          VERSION_NAME="${VERSION_LINE%%+*}"
          if [[ "$VERSION_LINE" == *"+"* ]]; then
            VERSION_CODE="${VERSION_LINE##*+}"
          else
            VERSION_CODE=1
          fi
          echo "Version: $VERSION_NAME (+$VERSION_CODE)"
          {
            echo "name=$VERSION_NAME"
            echo "code=$VERSION_CODE"
          } >> "$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: flutter build apk --release

      - name: Rename APK (VBUS_v<version>.apk)
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk "VBUS_v${{ steps.version.outputs.name }}.apk"

      - name: Prepare release notes
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          CHANGELOG="fastlane/metadata/android/en-US/changelogs/$VERSION_CODE.txt"
          if [[ -s "$CHANGELOG" && "$VERSION_CODE" != "1" ]]; then
            cp "$CHANGELOG" /tmp/notes.md
          else
            {
              echo "VBUS v$VERSION_NAME"
              echo
              echo "For the complete change history, see the commit log."
            } > /tmp/notes.md
          fi

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "VBUS ${{ steps.version.outputs.name }}" \
            --notes-file /tmp/notes.md \
            "VBUS_v${{ steps.version.outputs.name }}.apk"

      - name: Upload APK artifact (manual builds)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: VBUS_v${{ steps.version.outputs.name }}
          path: VBUS_v${{ steps.version.outputs.name }}.apk
